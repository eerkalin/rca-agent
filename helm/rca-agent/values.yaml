replicaCount: 1
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/eerkalin/rca-agent
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

runtime:
  logLevel: INFO

auth:
  # Disabled by default so existing installations upgrade without being locked
  # out. Enable after the bootstrap Secret is available.
  enabled: false
  bootstrapAdminUsername: admin
  sessionTtlSeconds: 28800
  cookieSecure: false

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rca-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

# By default the chart creates one bootstrap Secret and generates all internal
# credentials automatically. Set existingSecret only when you intentionally
# want to manage DATABASE_URL, RCA_MASTER_KEY, authentication secrets and MySQL
# passwords yourself.
secrets:
  existingSecret: ""
  keys:
    databaseUrl: database-url
    masterKey: rca-master-key
    authKey: rca-auth-key
    bootstrapAdminPassword: bootstrap-admin-password
    mysqlRootPassword: mysql-root-password
    mysqlPassword: mysql-password
    legacyGeminiApiKey: gemini-api-key
    legacyGeminiModel: gemini-model

mysql:
  enabled: true
  image: mysql:8.4
  database: rca_agent
  user: rca_agent
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6

migration:
  enabled: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
