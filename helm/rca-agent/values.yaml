replicaCount: 1

image:
  repository: ghcr.io/eerkalin/rca-agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rca-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

secrets:
  existingSecret: rca-agent-secrets
  keys:
    databaseUrl: database-url
    masterKey: rca-master-key
    legacyGeminiApiKey: gemini-api-key
    legacyGeminiModel: gemini-model

mysql:
  enabled: true
  image: mysql:8.4
  database: rca_agent
  user: rca_agent
  authSecret: rca-agent-secrets
  authKeys:
    rootPassword: mysql-root-password
    password: mysql-password
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

migration:
  enabled: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
