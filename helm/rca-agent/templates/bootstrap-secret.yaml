{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "rca-agent.bootstrapSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $rootPassword := randAlphaNum 32 -}}
{{- $mysqlPassword := randAlphaNum 32 -}}
{{- $masterKey := randBytes 32 | replace "+" "-" | replace "/" "_" -}}
{{- if $existing }}
  {{- if index $existing.data .Values.secrets.keys.mysqlRootPassword }}
    {{- $rootPassword = index $existing.data .Values.secrets.keys.mysqlRootPassword | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.mysqlPassword }}
    {{- $mysqlPassword = index $existing.data .Values.secrets.keys.mysqlPassword | b64dec -}}
  {{- end }}
  {{- if index $existing.data .Values.secrets.keys.masterKey }}
    {{- $masterKey = index $existing.data .Values.secrets.keys.masterKey | b64dec -}}
  {{- end }}
{{- end }}
{{- $mysqlHost := printf "%s-mysql" (include "rca-agent.fullname" .) -}}
{{- $databaseUrl := printf "mysql+pymysql://%s:%s@%s:3306/%s?charset=utf8mb4" .Values.mysql.user $mysqlPassword $mysqlHost .Values.mysql.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    rca-agent.io/credentials: auto-generated
    rca-agent.io/credential-policy: preserve-on-upgrade
type: Opaque
stringData:
  {{ .Values.secrets.keys.mysqlRootPassword }}: {{ $rootPassword | quote }}
  {{ .Values.secrets.keys.mysqlPassword }}: {{ $mysqlPassword | quote }}
  {{ .Values.secrets.keys.masterKey }}: {{ $masterKey | quote }}
  {{ .Values.secrets.keys.databaseUrl }}: {{ $databaseUrl | quote }}
{{- end }}
